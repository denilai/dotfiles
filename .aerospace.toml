# Конфиг AeroSpace. Живёт в репозитории dotfiles, ~/.aerospace.toml — симлинк на него.
# Описание: docs/aerospace.md, шпаргалка: docs/aerospace-cheatsheet.html
# После правки: aerospace reload-config (auto-reload-config включён).

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Cmd+H не прячет окна мимо модели воркспейсов: скрытое приложение сразу показывается снова
automatically-unhide-macos-hidden-apps = true

# Воркспейсы по ролям (буква = роль), 1–3 для разового.
persistent-workspaces = ["T", "B", "P", "D", "F", "S", "E", "1", "2", "3"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

# Модификатор — Hyper = ctrl-alt-shift-cmd (удержание правого Del thumb или левого Enter thumb на Corne).
# Привязок на Alt нет: они перехватывают символы Option и срабатывают от home-row Alt на Corne.
[mode.main.binding]

    # фокус
    ctrl-alt-shift-cmd-h = 'focus left'
    ctrl-alt-shift-cmd-j = 'focus down'
    ctrl-alt-shift-cmd-k = 'focus up'
    ctrl-alt-shift-cmd-l = 'focus right'

    # воркспейсы по ролям
    ctrl-alt-shift-cmd-t = 'workspace T'
    ctrl-alt-shift-cmd-b = 'workspace B'
    ctrl-alt-shift-cmd-p = 'workspace P'
    ctrl-alt-shift-cmd-d = 'workspace D'
    ctrl-alt-shift-cmd-f = 'workspace F'
    ctrl-alt-shift-cmd-s = 'workspace S'
    ctrl-alt-shift-cmd-e = 'workspace E'
    ctrl-alt-shift-cmd-1 = 'workspace 1'
    ctrl-alt-shift-cmd-2 = 'workspace 2'
    ctrl-alt-shift-cmd-3 = 'workspace 3'
    ctrl-alt-shift-cmd-tab = 'workspace-back-and-forth'

    # раскладки, окно
    # Не / , . : macOS забирает ⌃⌥⇧⌘ с / , . раньше AeroSpace (Karabiner-EventViewer их видит, AeroSpace нет)
    ctrl-alt-shift-cmd-v = 'layout tiles horizontal vertical'
    ctrl-alt-shift-cmd-a = 'layout accordion horizontal vertical'
    ctrl-alt-shift-cmd-g = 'layout floating tiling'
    ctrl-alt-shift-cmd-enter = 'fullscreen'   # окно на весь воркспейс, внешние зазоры (gaps.outer) сохраняются
    ctrl-alt-shift-cmd-equal = 'balance-sizes'

    # режимы
    ctrl-alt-shift-cmd-m = 'mode move'
    ctrl-alt-shift-cmd-r = 'mode resize'
    ctrl-alt-shift-cmd-semicolon = 'mode service'

    # Слой Nav на Corne шлёт ⌃←/→/↑/↓ (бывшие переключение Spaces, Mission Control и App Exposé):
    # на клавишах Nav+; Nav+' Nav+F Nav+G теперь воркспейсы и окно. Настоящие Ctrl+стрелки в
    # приложениях перехватываются.
    ctrl-left = 'workspace --wrap-around prev'
    ctrl-right = 'workspace --wrap-around next'
    ctrl-up = 'fullscreen'
    ctrl-down = 'layout floating tiling'

    # шпаргалка: комбо двух крайних sticky Shift на Corne шлёт F20
    f20 = 'exec-and-forget $HOME/repos/personal/dotfiles/scripts/aerospace-cheatsheet.sh toggle'


# Режим переноса окна: Hyper+M. Esc или Enter — выход.
[mode.move.binding]
    h = 'move left'
    j = 'move down'
    k = 'move up'
    l = 'move right'
    t = ['move-node-to-workspace T', 'mode main']
    b = ['move-node-to-workspace B', 'mode main']
    p = ['move-node-to-workspace P', 'mode main']
    d = ['move-node-to-workspace D', 'mode main']
    f = ['move-node-to-workspace F', 'mode main']
    s = ['move-node-to-workspace S', 'mode main']
    e = ['move-node-to-workspace E', 'mode main']
    1 = ['move-node-to-workspace 1', 'mode main']
    2 = ['move-node-to-workspace 2', 'mode main']
    3 = ['move-node-to-workspace 3', 'mode main']
    esc = 'mode main'
    enter = 'mode main'

# Режим размера: Hyper+R. Esc или Enter — выход.
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    j = 'resize height +50'
    k = 'resize height -50'
    b = 'balance-sizes'
    esc = 'mode main'
    enter = 'mode main'

# Сервисный режим: Hyper+;. Одна клавиша без модификаторов, затем выход.
[mode.service.binding]
    f = ['fullscreen', 'mode main']                              # на весь воркспейс AeroSpace (вкл/выкл), зазоры сохраняются
    g = ['layout floating tiling', 'mode main']                  # плавающее ↔ тайл (как Nav+G)
    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    b = ['balance-sizes', 'mode main']
    t = ['layout tiles horizontal vertical', 'mode main']
    v = ['layout tiles horizontal vertical', 'mode main']       # как Hyper+V
    a = ['layout accordion horizontal vertical', 'mode main']
    enter = ['fullscreen', 'mode main']                          # на весь воркспейс, зазоры сохраняются
    e = ['fullscreen --no-outer-gaps', 'mode main']              # вплотную ко всей видимой области (меню и Dock остаются)
    n = ['exec-and-forget $HOME/repos/personal/dotfiles/scripts/aerospace-native-fullscreen.sh', 'mode main']  # нативный fullscreen macOS (отдельный Space): вкл/выкл по состоянию окна, залипшее расклеивает
    x = ['exec-and-forget $HOME/repos/personal/dotfiles/scripts/aerospace-unstick.sh', 'mode main']  # расклеить окно, залипшее в macos_native_fullscreen
    q = ['close', 'mode main']
    esc = ['reload-config', 'mode main']

# Просмотрщик шпаргалок (по AeroSpace и по Corne): плавающее окно на текущем воркспейсе
[[on-window-detected]]
if.app-id = 'local.corne.keymapview'
run = 'layout floating'

# Окна запроса прав Admin By Request: плавающие, на текущем воркспейсе
[[on-window-detected]]
if.app-id = 'com.fasttracksoftware.adminbyrequest'
run = 'layout floating'

# --- приложения по воркспейсам (срабатывает один раз при появлении окна) ---

# T: терминал и редактор
[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = ['layout floating', 'move-node-to-workspace T']  # минимум окна ~940x600, в плитке вылезает за экран

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.apple.TextEdit'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.DanPristupov.Fork'
run = 'move-node-to-workspace T'

# B: браузер
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'org.openvpn.client.app'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'io.kandji.Self-Service'
run = 'move-node-to-workspace B'

# P: личное
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.electron.kontena-lens'
run = 'move-node-to-workspace P'

# D: документы
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace D'

# E: дом и развлечения (VLC, Photos, Home, iPhone Mirroring)
[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.apple.Photos'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.apple.Home'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenContinuity'
run = 'move-node-to-workspace E'

# F: системные окна (плавающие)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating', 'move-node-to-workspace F']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating', 'move-node-to-workspace F']

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['layout floating', 'move-node-to-workspace F']

# S: чат и календарь (приложения Chrome — Gmail, Calendar, Meet — имеют свои id)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.fmgjjmmmlfnkbppncabfkddbjimcfncm'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.kjbdgfilnfhdoflbpgamdcdgpehopbep'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.kjgfgldnnfoeklkmfkjfagphfepbbdan'
run = 'move-node-to-workspace S'
