# Конфиг AeroSpace. Живёт в репозитории dotfiles, ~/.aerospace.toml — симлинк на него.
# Описание: docs/aerospace.md, шпаргалка: docs/aerospace-cheatsheet.html
# После правки: aerospace reload-config (auto-reload-config включён).

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Воркспейсы по ролям (буква = роль), 1–3 для разового.
persistent-workspaces = ["T", "B", "P", "D", "F", "S", "1", "2", "3"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

# Модификатор — Hyper = ctrl-alt-shift-cmd (удержание правого Del thumb или левого Enter thumb на Corne).
# Alt-биндинги ниже — запасные, пока Hyper не проверен на железе.
[mode.main.binding]

    # фокус
    ctrl-alt-shift-cmd-h = 'focus left'
    ctrl-alt-shift-cmd-j = 'focus down'
    ctrl-alt-shift-cmd-k = 'focus up'
    ctrl-alt-shift-cmd-l = 'focus right'

    # воркспейсы по ролям
    ctrl-alt-shift-cmd-t = 'workspace T'
    ctrl-alt-shift-cmd-b = 'workspace B'
    ctrl-alt-shift-cmd-p = 'workspace P'
    ctrl-alt-shift-cmd-d = 'workspace D'
    ctrl-alt-shift-cmd-f = 'workspace F'
    ctrl-alt-shift-cmd-s = 'workspace S'
    ctrl-alt-shift-cmd-1 = 'workspace 1'
    ctrl-alt-shift-cmd-2 = 'workspace 2'
    ctrl-alt-shift-cmd-3 = 'workspace 3'
    ctrl-alt-shift-cmd-tab = 'workspace-back-and-forth'

    # раскладки, окно
    ctrl-alt-shift-cmd-slash = 'layout tiles horizontal vertical'
    ctrl-alt-shift-cmd-comma = 'layout accordion horizontal vertical'
    ctrl-alt-shift-cmd-period = 'layout floating tiling'
    ctrl-alt-shift-cmd-enter = 'fullscreen'
    ctrl-alt-shift-cmd-equal = 'balance-sizes'

    # режимы
    ctrl-alt-shift-cmd-m = 'mode move'
    ctrl-alt-shift-cmd-r = 'mode resize'

    # шпаргалка: комбо двух крайних sticky Shift на Corne шлёт F20
    f20 = 'exec-and-forget $HOME/repos/personal/dotfiles/scripts/aerospace-cheatsheet.sh toggle'

    # запасные alt-биндинги
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-t = 'workspace T'
    alt-b = 'workspace B'
    alt-p = 'workspace P'
    alt-d = 'workspace D'
    alt-f = 'workspace F'
    alt-s = 'workspace S'
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-p = 'move-node-to-workspace P'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-f = 'move-node-to-workspace F'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

# Режим переноса окна: Hyper+M. Esc или Enter — выход.
[mode.move.binding]
    h = 'move left'
    j = 'move down'
    k = 'move up'
    l = 'move right'
    t = ['move-node-to-workspace T', 'mode main']
    b = ['move-node-to-workspace B', 'mode main']
    p = ['move-node-to-workspace P', 'mode main']
    d = ['move-node-to-workspace D', 'mode main']
    f = ['move-node-to-workspace F', 'mode main']
    s = ['move-node-to-workspace S', 'mode main']
    1 = ['move-node-to-workspace 1', 'mode main']
    2 = ['move-node-to-workspace 2', 'mode main']
    3 = ['move-node-to-workspace 3', 'mode main']
    esc = 'mode main'
    enter = 'mode main'

# Режим размера: Hyper+R. Esc или Enter — выход.
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    j = 'resize height +50'
    k = 'resize height -50'
    b = 'balance-sizes'
    esc = 'mode main'
    enter = 'mode main'

# Сервисный режим: alt-shift-;
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Просмотрщик шпаргалок (по AeroSpace и по Corne): плавающее окно на текущем воркспейсе
[[on-window-detected]]
if.app-id = 'local.corne.keymapview'
run = 'layout floating'

# --- приложения по воркспейсам (срабатывает один раз при появлении окна) ---

# T: терминал и редактор
[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = ['layout floating', 'move-node-to-workspace T']  # минимум окна ~940x600, в плитке вылезает за экран

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.apple.TextEdit'
run = 'move-node-to-workspace T'

# B: браузер
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

# P: личное
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace P'

# D: документы
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace D'

# F: системные окна (плавающие)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating', 'move-node-to-workspace F']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating', 'move-node-to-workspace F']

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['layout floating', 'move-node-to-workspace F']

# S: чат и календарь (приложения Chrome — Gmail, Calendar, Meet — имеют свои id)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.fmgjjmmmlfnkbppncabfkddbjimcfncm'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.kjbdgfilnfhdoflbpgamdcdgpehopbep'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.kjgfgldnnfoeklkmfkjfagphfepbbdan'
run = 'move-node-to-workspace S'
